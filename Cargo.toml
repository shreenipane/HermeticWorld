[workspace]
members = [
    "crates/hermetic-common",
    "crates/hermetic-gateway",
    "crates/hermetic-sealcheck",
    "crates/vendor/tiny_http",
    "crates/hermetic-trust",
    "crates/hermetic-world-server",
    "crates/hermetic-vmm",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
authors = ["Hermetic World Team"]
license = "Apache-2.0"

[workspace.dependencies]
hermetic-common = { path = "crates/hermetic-common" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }
walkdir = "2.5"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "serde"] }
tempfile = "3.10"
flate2 = "1.0"
tar = "0.4"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
bzip2 = "0.4"
xz2 = "0.1"
zstd = "0.13"
rusqlite = { version = "0.32", features = ["bundled"] }
blake3 = "=1.8.7"
landlock = "=0.4.7"
seccompiler = "=0.5.0"
libc = "=0.2.191"
tree-sitter = "=0.25.0"
tree-sitter-python = "=0.25.0"
