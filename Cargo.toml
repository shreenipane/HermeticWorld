[workspace]
members = [
    "crates/hermetic-common",
    "crates/hermetic-sealcheck",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
authors = ["Hermetic World Team"]
license = "Apache-2.0"

[workspace.dependencies]
hermetic-common = { path = "crates/hermetic-common" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }
walkdir = "2.5"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "serde"] }
tempfile = "3.10"
