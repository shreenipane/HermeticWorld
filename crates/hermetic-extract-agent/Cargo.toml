
[package]
name = "hermetic-extract-agent"
version = "0.1.0"
edition = "2021"
description = "Guest-side deterministic change extractor for Hermetic World"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc.workspace = true

[dev-dependencies]
tempfile = "3"
# Host validator, used only by the cross-crate format compatibility tests.
hermetic-extract = { path = "../hermetic-extract" }


