[package]
name = "hermetic-grader-result"
version = "0.1.0"
edition = "2021"
description = "Hermetic World grader result disk format and differential verdict engine"

[lib]
name = "hermetic_grader_result"
path = "src/lib.rs"

[[bin]]
name = "hermetic-grader-verdict"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
