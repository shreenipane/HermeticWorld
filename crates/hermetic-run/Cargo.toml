
[package]
name = "hermetic-run"
version = "0.1.0"
edition = "2021"
description = "Deterministic evaluation runner for Hermetic World software-engineering benchmarks"

[dependencies]
hermetic-attest = { path = "../hermetic-attest" }
hermetic-sealcheck = { path = "../hermetic-sealcheck" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
ring = { workspace = true }


