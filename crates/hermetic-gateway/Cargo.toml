[package]
name = "hermetic-gateway"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "hermetic-gateway"
path = "src/main.rs"

[lib]
name = "hermetic_gateway"
path = "src/lib.rs"

[dependencies]
hermetic-common = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true }
time = { workspace = true }
getrandom = "=0.4.3"
tiny_http = "=0.12.0"
ureq = { version = "=2.12.1", default-features = false, features = ["tls"] }

[dev-dependencies]
tempfile = { workspace = true }
