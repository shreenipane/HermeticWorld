[package]
name = "hermetic-vmm"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
dev-unjailed = []

[dependencies]
hermetic-common = { workspace = true }
hermetic-extract = { path = "../hermetic-extract" }
hermetic-run = { path = "../hermetic-run" }
serde = { workspace = true }
serde_json = { workspace = true }
rustix = { version = "=1.1.6", features = ["fs", "process", "net", "event", "mount", "thread"] }
sha2 = { workspace = true }

[dev-dependencies]
hermetic-netvm-core = { path = "../hermetic-netvm-core" }
tempfile = { workspace = true }
