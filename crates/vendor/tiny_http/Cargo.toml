# Vendored copy of tiny_http 0.12.0 (crates.io), patched for Hermetic World.
# See VENDORED.md for the upstream source and the full list of changes.
[package]
name = "tiny_http"
version = "0.12.0"
authors = ["pierre.krieger1708@gmail.com",
           "Corey Farwell <coreyf@rwell.org>"]
description = "Low level HTTP server library (vendored and patched for Hermetic World)"
keywords = ["http", "server", "web"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/tiny-http/tiny-http"
edition = "2018"
publish = false

[lib]
# The upstream doc examples need the removed dev-dependencies (rustc-serialize).
doctest = false

[dependencies]
ascii = "1.0"
chunked_transfer = "1"
log = "0.4.4"
httpdate = "1.0.2"

[lints.rust]
# The upstream SSL code paths are kept verbatim but their features (and the optional
# openssl/rustls dependencies) were removed; declare the cfg values so rustc does not warn.
# Upstream code is kept as is; newer rustc flags some of it (and the reads removed by the
# patches) as unused. These settings apply to this vendored crate only.
dead_code = "allow"
unused_imports = "allow"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("ssl-openssl", "ssl-rustls"))'] }

[lints.clippy]
# Upstream code predates current clippy style lints; do not restyle vendored code.
all = { level = "allow", priority = -1 }
