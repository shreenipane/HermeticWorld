
[package]
name = "hermetic-netvm-core"
version = "0.1.0"
edition = "2021"
description = "Hermetic World network VM core library and binary"

[lib]
name = "hermetic_netvm_core"
path = "src/lib.rs"

[[bin]]
name = "hermetic-netvm"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"


