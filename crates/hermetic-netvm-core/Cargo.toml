
[package]
name = "hermetic-netvm-core"
version = "0.1.0"
edition = "2021"
description = "Hermetic World network VM core library and binary"

[lib]
name = "hermetic_netvm_core"
path = "src/lib.rs"

[[bin]]
name = "hermetic-netvm"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hermetic-common = { workspace = true }
hermetic-netvm-dns = { path = "../hermetic-netvm-dns" }
hermetic-netvm-http = { path = "../hermetic-netvm-http" }

hermetic-trust = { path = "../hermetic-trust" }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
sha2 = { workspace = true }
time = { workspace = true }
flate2 = { workspace = true }
hex = { workspace = true }
sha1 = { workspace = true }

[dev-dependencies]
hermetic-gateway = { path = "../hermetic-gateway" }
hermetic-world-server = { path = "../hermetic-world-server" }
tempfile = { workspace = true }
tiny_http = { path = "../vendor/tiny_http" }
