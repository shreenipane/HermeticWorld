
[package]
name = "hermetic-extract-walk"
version = "0.1.0"
edition = "2021"
description = "Bounded, symlink-safe repository diff extractor for Hermetic World evaluations"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc.workspace = true

[dev-dependencies]
tempfile = "3"


