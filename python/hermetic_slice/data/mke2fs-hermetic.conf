# Pinned mke2fs configuration for Hermetic World rootfs images (TR-SEAL-7, TR-SEAL-12).
#
# build_rootfs() points MKE2FS_CONFIG at this file so the host's /etc/mke2fs.conf never
# chooses features, block size, inode size, hash algorithm or journal behaviour. The
# builder also passes every image-shaping option explicitly on the command line
# (-O none,<features> -b -I -N -J -m -G -e -T -E); this file only fixes the defaults
# that have no command-line switch and keeps the rest consistent with the command line.
# Changing anything here changes every image digest: treat it as a format change.

[defaults]
	base_features = sparse_super,large_file,filetype,dir_index,ext_attr
	default_mntopts = acl,user_xattr
	enable_periodic_fsck = 0
	blocksize = 4096
	inode_size = 256
	inode_ratio = 16384
	reserved_ratio = 5.0
	hash_alg = half_md4
	flex_bg_size = 16
	errors = continue
	lazy_itable_init = false
	lazy_journal_init = false

[fs_types]
	ext4 = {
		features = has_journal,extent,huge_file,flex_bg,metadata_csum,64bit,dir_nlink,extra_isize
	}
	hermetic = {
		inode_ratio = 16384
	}
