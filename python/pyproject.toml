[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "hermetic-slice"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
harbor = ["harbor==0.25.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "docker: marks tests requiring a functional docker daemon",
]


[tool.setuptools.package-data]
hermetic_slice = ["data/*.conf"]
